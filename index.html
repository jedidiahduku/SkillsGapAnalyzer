      margin-bottom: 16px;

    }

      color: var(--text-muted);

      line-height: 1.7;
    }

      color: var(--accent);

    }

      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);

      border-radius: 24px;

      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);

      from { opacity: 0; transform: translateY(24px); }

    }

    .input-group { display: flex; gap: 12px; margin-bottom: 32px; }

    input#skills {
      flex: 1;
      padding: 16px 20px;
      font-size: 1rem;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: white;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      font-family: 'Outfit', sans-serif;
    }

    input#skills:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    input#skills::placeholder { color: rgba(255,255,255,0.35); }

    button#analyzeBtn {

      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Outfit', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;

    }

      border-radius: 16px;

    }

// ══════════════════════════════════════════════════════════════
//  Stats Counter Animation
// ══════════════════════════════════════════════════════════════
function animateCount(el, target, duration = 1200) {
  let start = 0;
  const step = (ts) => {
    if (!start) start = ts;
    const progress = Math.min((ts - start) / duration, 1);
    el.textContent = Math.floor(progress * target);
    if (progress < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

const allSkills = new Set();
Object.values(jobs).forEach(s => s.forEach(sk => allSkills.add(sk)));

window.addEventListener('DOMContentLoaded', () => {
  animateCount(document.getElementById('roleCount'), Object.keys(jobs).length);
  animateCount(document.getElementById('skillCount'), allSkills.size);
  animateCount(document.getElementById('sectorCount'), 15);
});

// ══════════════════════════════════════════════════════════════
//  Analysis Engine (runs 100% in the browser)
// ══════════════════════════════════════════════════════════════
function analyze() {
  const raw = document.getElementById('skills').value;
  const resultsDiv = document.getElementById('results');

  if (!raw.trim()) {
    resultsDiv.innerHTML = '<p class="message error">Please enter at least one skill to get started.</p>';
    return;
  }

  const userSkills = new Set(
    raw.split(',').map(s => s.trim()).filter(Boolean)
  );

  resultsDiv.innerHTML = '<p class="message loading">Analyzing against ' + Object.keys(jobs).length + ' career roles…</p>';

  // Small delay for the loading animation to feel intentional
  setTimeout(() => {
    const results = [];

    for (const [role, required] of Object.entries(jobs)) {
      const requiredSet = new Set(required);
      const matched = [...requiredSet].filter(s => userSkills.has(s));
      const gap = [...requiredSet].filter(s => !userSkills.has(s));
      const matchScore = Math.round((matched.length / requiredSet.size) * 100);

      results.push({ role, match: matchScore, gap: gap.sort() });
    }

    results.sort((a, b) => b.match - a.match);
    const top5 = results.slice(0, 5);

    let html = '';
    top5.forEach((item, index) => {
      const gapSkillsHTML = item.gap.length
        ? `<div class="gap-label">Missing: ${item.gap.map(g => {
            const q = encodeURIComponent(g + ' course');
            return `<a class="gap-tag" href="https://www.coursera.org/search?query=${q}" target="_blank" rel="noopener" title="Find ${g} courses on Coursera">${g}</a>`;
          }).join('')}</div>`
        : `<div class="gap-label no-gap">✓ You meet all core requirements!</div>`;

      // Build learn links for missing skills
      let learnHTML = '';
      if (item.gap.length) {
        const searchQuery = encodeURIComponent(item.gap.join(' ') + ' skills course');
        const roleQuery = encodeURIComponent(item.role + ' skills');
        learnHTML = `
        <div class="learn-links">
          <span class="learn-label">📚 Learn these:</span>
          <a class="learn-btn coursera" href="https://www.coursera.org/search?query=${roleQuery}" target="_blank" rel="noopener">Coursera</a>
          <a class="learn-btn youtube" href="https://www.youtube.com/results?search_query=${searchQuery}" target="_blank" rel="noopener">YouTube</a>
          <a class="learn-btn udemy" href="https://www.udemy.com/courses/search/?q=${roleQuery}" target="_blank" rel="noopener">Udemy</a>
          <a class="learn-btn google" href="https://www.google.com/search?q=free+${searchQuery}" target="_blank" rel="noopener">Google</a>
        </div>`;
      }

      html += `
      <div class="result-card" style="animation-delay: ${index * 0.1}s">
        <div class="card-header">
          <div class="card-left">
            <div class="card-rank">${index + 1}</div>
            <span class="role-title">${item.role}</span>
          </div>
          <span class="match-percent">${item.match}%</span>
        </div>
        <div class="bar-container">
          <div class="bar" id="bar-${index}"></div>
        </div>
        ${gapSkillsHTML}
        ${learnHTML}
      </div>`;
    });

    resultsDiv.innerHTML = html || '<p class="message">No matching roles found.</p>';

    // Animate bars after DOM paint
    requestAnimationFrame(() => {
      top5.forEach((item, i) => {
        const bar = document.getElementById('bar-' + i);
        if (bar) bar.style.width = item.match + '%';
      });
    });
  }, 400);
}

// Enter key support
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('skills').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') analyze();
  });
});
</script>
</body>
</html>
